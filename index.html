
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#163b56">
 <link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
 
<title>Hot Slab Length Calculator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#eef2f5;
 font-family:Arial,sans-serif;color:#243447;
}
.container{
 max-width:450px;margin:20px auto;
 background:white;padding:24px;
 border-radius:18px;
 box-shadow:0 5px 20px #0001;
}
.header{
 background:#163b56;color:white;
 padding:23px 12px;border-radius:13px;
 text-align:center;margin-bottom:24px;
}
.header h2{margin:0;font-size:22px}
.header p{font-size:12px;margin:8px 0 0}
label{
 display:block;font-weight:bold;
 margin:17px 0 8px;
}
select,input{
 width:100%;padding:14px;
 border:1px solid #cbd5df;
 border-radius:9px;font-size:16px;
 background:white;
}
button{
 width:100%;padding:15px;
 border:0;border-radius:9px;
 color:white;font-size:16px;
 font-weight:bold;margin-top:16px;
 cursor:pointer;
}
.calculate{background:#163b56}
.reset{background:#64748b}
.whatsapp{background:#16834b}
.result{
 display:none;margin-top:22px;
 background:#e9f6ee;
 padding:20px;border-radius:12px;
 text-align:center;
}
.result h1{
 color:#16834b;font-size:34px;
 margin:12px 0;
}
.result p{margin:5px;font-size:13px}
.footer{
 text-align:center;font-size:11px;
 color:#87929d;margin-top:25px;
}
</style>
</head>
<body>
<div class="container">

 <div class="header">
  <h2>HOT SLAB LENGTH</h2>
  <p>PRODUCTION CALCULATOR</p>
 </div>

 <label for="pickup">PICKUP</label>
 <select id="pickup">
  <option value="4">Pickup 4</option>
  <option value="3">Pickup 3</option>
 </select>

 <label for="daughter">DAUGHTER</label>
 <select id="daughter">
  <option value="1">Daughter 1</option>
  <option value="2">Daughter 2</option>
  <option value="3">Daughter 3</option>
 </select>

 <label for="dp">DP (mm)</label>
 <input id="dp" type="text" inputmode="decimal"
 placeholder="Masukkan nilai DP">

 <label for="dc">DC (mm)</label>
 <input id="dc" type="text" inputmode="decimal"
 placeholder="Masukkan nilai DC">

 <button class="calculate" onclick="calculate()">
  HITUNG HOT SLAB LENGTH
 </button>

 <div class="result" id="result">
  <p>HASIL HOT SLAB LENGTH</p>
  <h1 id="output">0 mm</h1>
  <p id="detail"></p>
 </div>

 <button class="whatsapp" id="share"
 onclick="shareWhatsApp()" style="display:none">
  BAGIKAN KE WHATSAPP
 </button>

 <button class="reset" onclick="resetForm()">
  RESET
 </button>

 <div class="footer">
  HOT SLAB LENGTH CALCULATOR
  <br>Production Tool
 </div>
</div>

<script>
let lastResult = null;

function getD(pickup,daughter){
 const constants = {
  "4":{"1":10008,"2":10009,"3":10008},
  "3":{"1":10000,"2":10000,"3":10000}
 };
 return constants[pickup][daughter];
}

function readNumber(id){
 const value = document.getElementById(id)
  .value.trim().replace(",",".");
 if(value === "") return null;
 const number = Number(value);
 return Number.isFinite(number) ? number : null;
}

function formatNumber(number){
 return new Intl.NumberFormat("id-ID",{
  maximumFractionDigits:2
 }).format(number);
}

function calculate(){
 const pickup = document.getElementById("pickup").value;
 const daughter = document.getElementById("daughter").value;
 const dp = readNumber("dp");
 const dc = readNumber("dc");

 if(dp === null || dc === null){
  alert("DP dan DC wajib diisi dengan angka.");
  return;
 }

 if(dp < 0 || dc < 0){
  alert("DP dan DC tidak boleh negatif.");
  return;
 }

 const D = getD(pickup,daughter);
 const answer = D - (dp + dc);

 if(answer < 0){
  alert("Hasil perhitungan negatif. Periksa kembali DP dan DC.");
  return;
 }

 lastResult = {
  pickup,daughter,dp,dc,answer
 };

 document.getElementById("output").textContent =
  formatNumber(answer) + " mm";

 document.getElementById("detail").textContent =
  "Pickup " + pickup + " | Daughter " + daughter;

 document.getElementById("result").style.display = "block";
 document.getElementById("share").style.display = "block";
}

function shareWhatsApp(){
 if(!lastResult) return;

 const r = lastResult;
 const message =
  "*HOT SLAB LENGTH RESULT*\n\n" +
  "Pickup: " + r.pickup + "\n" +
  "Daughter: " + r.daughter + "\n" +
  "DP: " + formatNumber(r.dp) + " mm\n" +
  "DC: " + formatNumber(r.dc) + " mm\n\n" +
  "*Hot Slab Length: " +
  formatNumber(r.answer) + " mm*";

 window.open(
  "https://wa.me/?text=" + encodeURIComponent(message),
  "_blank"
 );
}

function resetForm(){
 document.getElementById("pickup").value = "4";
 document.getElementById("daughter").value = "1";
 document.getElementById("dp").value = "";
 document.getElementById("dc").value = "";
 document.getElementById("result").style.display = "none";
 document.getElementById("share").style.display = "none";
 lastResult = null;
}
</script>
 <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(registration => {
        console.log("Offline siap:", registration.scope);
      })
      .catch(error => {
        console.error("Service Worker gagal:", error);
      });
  });
}
</script>
</body>
</html>
